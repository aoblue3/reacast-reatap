[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ReaTap"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
# 設定の書き出し・読み込みのファイル選択(backup.rs)
tauri-plugin-dialog = "2"
# 単体exeのままの自動アップデート機能用(updater.rs参照)。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
# 管理者の見張り係のタスクの確認で、schtasksの出力(Shift_JIS)を読む(key_watcher.rs)
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_Security",
  # ホットキーのためのキーボードの見張り(hotkeys.rs)
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  # 管理者の権限で動くキーの見張り係のタスクを登録する(key_watcher.rs)
  "Win32_UI_Shell",
  "Win32_System_Registry",
] }
