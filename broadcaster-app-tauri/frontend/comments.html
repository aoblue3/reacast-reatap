<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<!-- favicon.icoの読み込みエラーがログに出ないように -->
<link rel="icon" href="data:," />
<title>ReaCast コメント一覧</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #list {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 4px 6px;
    box-sizing: border-box;
    overflow: hidden;
  }
  /* 視聴者数・コメント数(「視聴者数・コメント数」タブの「コメント一覧の上にも出す」) */
  #aud { position: fixed; left: 0; right: 0; top: 0; padding: 4px 8px; box-sizing: border-box; }
  #list.with-aud { top: var(--aud-h, 0px); }
  /* 新しいレスを下に追加する設定の時は、下端に寄せる */
  #list.bottom { justify-content: flex-end; }
  /* カスタムCSSで使えるクラス:
     .item(レス全体) .icon(アイコン) .content .head(見出し) .no(番号) .avatar(YouTube・Twitchの人のアイコン) .name(名前)
     .date(時刻) .body(本文) .thumbs(サムネイル) .item.aa(AA) .item.system(お知らせ)
     .src(取得元の印) .item.src-bbs / .item.src-youtube / .item.src-twitch(取得元ごと)
     .item.board-jpnkn / .item.board-shitaraba / .item.board-bbs(掲示板の種類ごと。bbsはそのほかの掲示板) */
  /* 応援(スーパーチャット・ビッツ等)。カスタムCSSでは .item.paid / .paid-superchat / .paid-sticker /
     .paid-member / .paid-bits / .paid-sub / .paid-gift / .paid-raid / .paid-badge(金額の札) */
  .item.paid { box-shadow: inset 5px 0 0 rgba(255, 255, 255, 0.55); }
  .item.paid .head span { color: var(--paid-text) !important; }
  .paid-badge { display: inline-block; font-weight: bold; padding: 0 0.45em; border-radius: 4px; background: rgba(0, 0, 0, 0.28); color: #ffffff; text-shadow: none; }
  .item {
    position: relative;
    display: flex;
    gap: 0.4em;
    align-items: flex-start;
    margin: 0 0 var(--item-gap, 10px);
    animation: item-in 220ms ease-out;
    flex: 0 0 auto;
    box-sizing: border-box;
  }
  .icon { flex: 0 0 auto; object-fit: cover; border-radius: 6px; }
  .content { min-width: 0; flex: 1 1 auto; }
  .head > span + span, .head > .avatar + span { margin-left: 0.4em; }
  /* YouTube・Twitchのコメントを書いた人のアイコン(レス番号の位置に出す) */
  .head .avatar { width: 1.4em; height: 1.4em; border-radius: 50%; object-fit: cover; vertical-align: middle; }
  .head .src { font-size: 0.8em; padding: 0 0.35em; border-radius: 3px; color: #fff; text-shadow: none; }
  .src-youtube .head .src { background: #e62117; }
  .src-twitch .head .src { background: #9146ff; }
  .src-bbs .head .src { background: #5a6270; }
  .board-jpnkn .head .src { background: #2f7d4f; }
  .board-shitaraba .head .src { background: #b5651d; }
  .content.inline .head { display: inline; margin-right: 0.5em; }
  .content.inline .body { display: inline; }
  .body { white-space: pre-wrap; word-break: break-word; }
  #list.nowrap .body, #list.nowrap .head { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  /* AAは一覧のフォントではなく「AAモード」のフォントで描く(文字幅が違うとずれる) */
  .item.aa .body { white-space: pre; font-size: 0.6em; line-height: 1.1; font-family: var(--aa-font, 'MS PGothic', 'ReaCast Emoji', sans-serif); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .thumbs img { max-width: 100%; max-height: 6em; border-radius: 4px; }
  @keyframes item-in {
    from { opacity: 0; transform: translateX(12px); }
    to { opacity: 1; transform: none; }
  }
  /* デスクトップのレス一覧の位置調整モード(ReaCastの設定画面から切り替える) */
  #adjust {
    display: none;
    position: fixed;
    inset: 0;
    box-sizing: border-box;
    border: 3px dashed #ffd23f;
    background: rgba(20, 22, 30, 0.35);
    cursor: move;
    font-family: 'Yu Gothic UI', 'ReaCast Emoji', sans-serif;
    color: #fff;
  }
  body.adjusting #adjust { display: block; }
  #adjust .msg {
    position: absolute;
    left: 10px;
    top: 8px;
    font-size: 14px;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 8px;
    border-radius: 4px;
    pointer-events: none;
  }
  #adjust button {
    position: absolute;
    right: 10px;
    top: 8px;
    font: inherit;
    font-size: 14px;
    padding: 4px 14px;
    border: none;
    border-radius: 4px;
    background: #3b6df0;
    color: #fff;
    cursor: pointer;
  }
  #adjust .grip {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 22px;
    height: 22px;
    cursor: se-resize;
    background: linear-gradient(135deg, transparent 50%, #ffd23f 50%);
  }
  /* ---- 「ウィンドウにする」の時(マウスで操作できるデスクトップのコメント一覧) ---- */
  /* マウスを乗せている間だけ、窓の範囲がわかるように薄い枠を出す */
  body.interactive:hover::after { content: ''; position: fixed; inset: 0; border: 1px dashed rgba(255, 255, 255, 0.35); pointer-events: none; }
  #bar, #more, #menu, #toast, #reading { font-family: 'Yu Gothic UI', 'ReaCast Emoji', sans-serif; font-size: 13px; text-shadow: none; }
  /* 過去のコメントを見ている時の「最新に戻る」(最新のコメントの側に出す) */
  /* マウスを乗せている間だけ出す、上の帯(ドラッグで移動・過去のコメントのボタン)と右下の角(大きさ) */
  #bar { display: none; position: fixed; left: 0; right: 0; top: 0; z-index: 6; height: 26px; align-items: center; gap: 4px; padding: 0 4px; box-sizing: border-box; background: rgba(20, 22, 30, 0.82); color: #fff; cursor: move; user-select: none; }
  body.interactive:hover #bar { display: flex; }
  body.adjusting #bar, body.adjusting #igrip { display: none !important; }
  #bar .grab { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; opacity: 0.8; }
  #bar button { padding: 1px 8px; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 4px; background: rgba(255, 255, 255, 0.08); color: #fff; font: inherit; font-size: 12px; cursor: pointer; }
  #bar button:hover { background: #3b6df0; }
  #igrip { display: none; position: fixed; right: 0; bottom: 0; z-index: 6; width: 18px; height: 18px; cursor: se-resize; background: linear-gradient(135deg, transparent 50%, rgba(255, 255, 255, 0.6) 50%); }
  body.interactive:hover #igrip { display: block; }
  #more { display: none; position: fixed; left: 50%; transform: translateX(-50%); bottom: 6px; z-index: 5; padding: 4px 12px; border-radius: 14px; background: rgba(20, 22, 30, 0.88); color: #fff; border: 1px solid rgba(255, 255, 255, 0.25); cursor: pointer; white-space: nowrap; }
  #more.top { bottom: auto; top: 6px; }
  #more.visible { display: block; }
  #menu { display: none; position: fixed; z-index: 10; min-width: 220px; max-width: calc(100vw - 8px); padding: 4px 0; background: #24262d; color: #e6e6ea; border: 1px solid #3a3d47; border-radius: 6px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); }
  #menu.visible { display: block; }
  #menu button { display: block; width: 100%; padding: 5px 14px; border: none; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #menu button:hover:not(:disabled) { background: #3b6df0; color: #fff; }
  #menu button:disabled { color: #7d808c; cursor: default; }
  #menu hr { border: none; border-top: 1px solid #3a3d47; margin: 4px 0; }
  #toast { display: none; position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 11; padding: 6px 10px; border-radius: 6px; background: rgba(20, 22, 30, 0.92); color: #fff; }
  #toast.visible { display: block; }
  #reading { display: none; position: fixed; inset: 0; z-index: 12; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.35); }
  #reading.visible { display: flex; }
  #reading > div { width: min(320px, calc(100vw - 16px)); padding: 12px; border-radius: 8px; background: #24262d; color: #e6e6ea; border: 1px solid #3a3d47; }
  #reading .ttl { margin-bottom: 8px; font-weight: bold; word-break: break-all; }
  #reading input { width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid #3a3d47; border-radius: 4px; background: #16171c; color: #e6e6ea; font: inherit; }
  #reading .btns { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
  #reading button { padding: 4px 14px; border: none; border-radius: 4px; background: #3b6df0; color: #fff; font: inherit; cursor: pointer; }
  #reading button.sub { background: #3a3d47; }
</style>
</head>
<body>
  <div id="aud" class="aud empty"></div>
  <div id="list"></div>
  <div id="bar"><span class="grab" title="ドラッグで移動">⠿ ドラッグで移動</span><button id="barOlder" title="古いコメントへ(キーボードの↑↓・PageUp・PageDownでも動かせます)">古い方へ</button><button id="barNewer" title="新しいコメントへ">新しい方へ</button><button id="barLatest" title="一番新しいコメントへ(Endキー)">最新</button></div>
  <div id="igrip" title="ドラッグで大きさを変える"></div>
  <div id="more"></div>
  <div id="menu"></div>
  <div id="toast"></div>
  <div id="reading"><div>
    <div class="ttl">「<span id="readingWord"></span>」の読み方</div>
    <input type="text" id="readingInput" placeholder="ひらがな・カタカナで(空欄なら読まない)" />
    <div class="btns"><button id="readingCancel" class="sub">やめる</button><button id="readingOk">登録</button></div>
  </div></div>
  <div id="adjust">
    <div class="msg">ドラッグで移動 / 右下の角をドラッグで大きさを変更</div>
    <button id="adjustDone">完了</button>
    <div class="grip" id="grip"></div>
  </div>
  <script src="shared/error-log.js"></script>
  <script src="shared/comment-common.js"></script>
  <script>
    'use strict';
    const C = window.CommentCommon;
    const listEl = document.getElementById('list');
    const audEl = document.getElementById('aud');
    let audState = null;
    {
      const css = document.createElement('style');
      css.textContent = C.AUDIENCE_CSS;
      document.head.appendChild(css);
    }
    // 視聴者数・コメント数は、コメント一覧と同じ文字(大きさは少し小さく)で、一覧の上に出す
    function renderAud() {
      const a = style.audience;
      const on = !!a.showInList;
      audEl.style.display = on ? '' : 'none';
      if (on) {
        const s = style.list;
        audEl.style.fontFamily = C.cssFontFamily(s.fontFamily);
        audEl.style.fontSize = `${Math.round((Number(s.fontSize) || 20) * 0.9)}px`;
        audEl.style.fontWeight = 'bold';
        audEl.style.color = s.bodyColor || '#ffffff';
        audEl.style.textShadow = C.outlineShadow(s.outlineWidth, s.outlineColor);
        C.renderAudience(audEl, audState, { ...a, layout: 'row' });
      }
      const shown = on && !audEl.classList.contains('empty');
      listEl.classList.toggle('with-aud', shown);
      listEl.style.setProperty('--aud-h', shown ? `${audEl.offsetHeight}px` : '0px');
    }
    let style = C.mergeStyle(null);
    let items = [];
    const PREVIEW = new URLSearchParams(location.search).has('preview');
    // ReaCastがデスクトップに出す窓として開いた時(OBSの画面キャプチャで配信する人向け)
    const DESKTOP = !PREVIEW && !!(window.__TAURI__ && window.__TAURI__.core);

    function applyListStyle() {
      const s = style.list;
      // 「コメント一覧を使う」がOFFの時は何も出さない
      document.body.style.display = s.enabled === false ? 'none' : '';
      listEl.style.fontFamily = C.cssFontFamily(s.fontFamily);
      listEl.style.fontSize = `${Number(s.fontSize) || 20}px`;
      listEl.style.textShadow = C.outlineShadow(s.outlineWidth, s.outlineColor);
      listEl.style.lineHeight = String(Number(s.lineHeight) || 1.3);
      listEl.style.setProperty('--item-gap', `${Math.max(0, Number(s.itemGap) || 0)}px`);
      listEl.style.setProperty('--aa-font', C.cssFontFamily(style.aa.fontFamily));
      listEl.classList.toggle('bottom', !s.newestFirst);
      listEl.classList.toggle('nowrap', !s.wrap);
      C.applyCustomCss(s.customCss);
    }

    function span(cls, text, color) {
      const el = document.createElement('span');
      el.className = cls;
      el.textContent = text;
      if (color) el.style.color = color;
      return el;
    }

    function avatarImg(url) {
      const img = document.createElement('img');
      img.className = 'avatar';
      img.src = url;
      img.referrerPolicy = 'no-referrer';
      img.onerror = () => img.remove();
      return img;
    }

    /** 背景の色が明るいか(応援の札の文字色を黒にするか白にするか) */
    function isLight(hex) {
      const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(String(hex || ''));
      if (!m) return true;
      const [r, g, b] = [m[1], m[2], m[3]].map((h) => parseInt(h, 16) / 255);
      return 0.299 * r + 0.587 * g + 0.114 * b > 0.6;
    }

    function buildItem(res) {
      const s = style.list;
      const el = document.createElement('div');
      // スーパーチャット・ビッツ等の応援(設定「応援を目立たせる」がONの時)
      const paid = s.showPaid !== false && res.paid && !res.system ? res.paid : null;
      el.className =
        'item' + (res.aa ? ' aa' : '') + (res.system ? ' system' : '') + (res.source ? ` src-${res.source}` : '') +
        (res.board ? ` board-${res.board}` : '') +
        (paid ? ` paid paid-${paid.kind}` : '');
      const bgOpacity = Number(s.itemBgOpacity) || 0;
      if (bgOpacity > 0) el.style.background = C.rgba(s.itemBgColor, bgOpacity);
      if (paid) {
        el.style.setProperty('--paid-color', paid.color);
        el.style.setProperty('--paid-text', isLight(paid.color) ? '#111111' : '#ffffff');
        el.style.background = C.rgba(paid.color, 90);
      }
      el.style.padding = `${Math.max(0, Number(s.itemPadding) || 0)}px`;
      el.style.borderRadius = `${Math.max(0, Number(s.itemRadius) || 0)}px`;

      if (s.showIcon && res.icon) {
        const img = document.createElement('img');
        img.className = 'icon';
        // デスクトップに出す窓(ReaCastの中)では、ReaCastの中の画面のURLになってしまうので、
        // OBSに出しているのと同じ所から読む
        img.src = DESKTOP && res.icon.startsWith('/') ? `http://127.0.0.1:18772${res.icon}` : res.icon;
        const size = Math.max(12, Number(s.iconSize) || 40);
        img.style.width = img.style.height = `${size}px`;
        img.onerror = () => img.remove();
        el.appendChild(img);
      }

      const content = document.createElement('div');
      content.className = 'content' + (s.separateLines ? '' : ' inline');
      const head = document.createElement('div');
      head.className = 'head';
      head.style.fontSize = Number(s.headFontSize) > 0 ? `${Number(s.headFontSize)}px` : '0.8em';
      head.style.fontWeight = s.headBold ? 'bold' : 'normal';
      if (paid) {
        const badge = document.createElement('span');
        badge.className = 'paid-badge';
        badge.textContent = paid.amount;
        head.appendChild(badge);
      }
      if (res.system) {
        if (res.name) head.appendChild(span('name', res.name, s.nameColor));
      } else {
        // 掲示板の印は、2種類以上の掲示板のレスが来ている時だけ(1つなら見分ける必要が無いので)
        const label =
          res.source === 'bbs'
            ? boardsSeen.size > 1 ? { jpnkn: 'jpnkn', shitaraba: 'したらば' }[res.board] || '掲示板' : ''
            : { youtube: 'YouTube', twitch: 'Twitch' }[res.source];
        if (s.showSource && label) head.appendChild(span('src', label));
        if (s.showResNumber && res.no > 0) head.appendChild(span('no', String(res.no), s.numberColor));
        else if (s.showResNumber && res.avatar) head.appendChild(avatarImg(res.avatar));
        if (s.showName && res.name) head.appendChild(span('name', res.name, s.nameColor));
        if (s.showDate && res.date) head.appendChild(span('date', res.date, s.dateColor));
      }
      if (head.childNodes.length) content.appendChild(head);

      const images = s.thumbnails === 'chat' && !res.aa ? C.findImageUrls(res.body) : [];
      let bodyText = paid ? String(paid.message || '') : String(res.body || '');
      if (images.length && s.hideImageUrl) bodyText = bodyText.replace(C.IMAGE_URL_RE, '').trim();
      if (bodyText) {
        const body = document.createElement('div');
        body.className = 'body';
        body.style.color = paid ? 'var(--paid-text)' : s.bodyColor;
        body.style.fontWeight = s.bodyBold ? 'bold' : 'normal';
        body.textContent = bodyText;
        content.appendChild(body);
      }
      if (images.length) {
        const thumbs = document.createElement('div');
        thumbs.className = 'thumbs';
        for (const url of images.slice(0, 4)) {
          const img = document.createElement('img');
          img.src = url;
          img.referrerPolicy = 'no-referrer';
          img.onerror = () => img.remove();
          thumbs.appendChild(img);
        }
        content.appendChild(thumbs);
      }
      el.appendChild(content);
      el._res = res;
      return el;
    }

    function maxItems() {
      return Math.max(1, Math.min(100, Number(style.list.maxItems) || 30));
    }

    // 覚えておくコメントの数(「ウィンドウにする」の時に、ホイールで見返せる)
    const HISTORY_MAX = 500;
    // ホイールで遡っている時の、隠れている新しいコメントの数(0なら最新を表示中)
    let offset = 0;

    function render() {
      applyListStyle();
      listEl.textContent = '';
      offset = Math.max(0, Math.min(offset, items.length - 1));
      const end = items.length - offset;
      const shown = items.slice(Math.max(0, end - maxItems()), end);
      const ordered = style.list.newestFirst ? shown.slice().reverse() : shown;
      for (const res of ordered) {
        const el = buildItem(res);
        el.style.animation = 'none';
        listEl.appendChild(el);
      }
      renderMore();
    }

    // 来たことのある掲示板の種類(2種類以上なら、掲示板のレスにも取得元の印を付ける)
    const boardsSeen = new Set();
    function noteBoard(res) {
      if (!res || res.source !== 'bbs' || !res.board || boardsSeen.has(res.board)) return false;
      boardsSeen.add(res.board);
      return boardsSeen.size === 2;
    }

    function add(res) {
      items.push(res);
      if (items.length > HISTORY_MAX) items = items.slice(-HISTORY_MAX);
      // 過去のコメントを見ている間は、表示を動かさない(新しいコメントの数だけ数える)
      if (offset > 0) {
        offset++;
        renderMore();
        return;
      }
      // 2つ目の種類の掲示板が来たら、前のレスにも印を付けるために描き直す
      if (noteBoard(res)) {
        render();
        return;
      }
      const el = buildItem(res);
      if (style.list.newestFirst) listEl.prepend(el);
      else listEl.appendChild(el);
      while (listEl.children.length > maxItems()) {
        (style.list.newestFirst ? listEl.lastElementChild : listEl.firstElementChild).remove();
      }
    }

    // ?source=youtube のように付けると、その取得元のレスだけを出す(複数は「,」区切り。
    // bbs=掲示板の全部 jpnkn・shitaraba=その掲示板だけ youtube=YouTube twitch=Twitch)。
    // 付けなければ全部。ReaCastからのお知らせは常に出す
    const onlySources = (new URLSearchParams(location.search).get('source') || '')
      .split(',')
      .map((x) => x.trim().toLowerCase())
      .filter(Boolean);
    const wanted = (res) => !onlySources.length || !res || res.system || res.source === 'system' || onlySources.includes(res.source) || (!!res.board && onlySources.includes(res.board));

    function handle(msg) {
      if (msg.type === 'commentStyle') {
        style = C.mergeStyle(msg.style);
        render();
        renderAud();
      } else if (msg.type === 'audience') {
        audState = msg.state;
        renderAud();
      } else if (msg.type === 'commentHistory') {
        items = Array.isArray(msg.items) ? msg.items.filter(wanted).slice(-HISTORY_MAX) : [];
        offset = 0;
        items.forEach(noteBoard);
        render();
      } else if (msg.type === 'commentClear') {
        items = [];
        offset = 0;
        render();
      } else if (msg.type === 'comment' && msg.res) {
        if (wanted(msg.res)) add(msg.res);
      }
    }

    // ?preview: ReaCastの設定画面に埋め込むプレビュー用。ブリッジには繋がず、
    // 設定画面から送られてくる見た目とサンプルのレスで描画する。
    if (PREVIEW) {
      // 設定画面(ダーク)に埋め込むと、色の設定が違うiframeは白く塗られるので合わせる
      document.documentElement.style.colorScheme = 'dark';
      window.addEventListener('message', (e) => {
        if (e.source !== window.parent || !e.data || typeof e.data.type !== 'string') return;
        handle(e.data);
      });
    } else {
      C.connectBridge(handle);
    }
    applyListStyle();

    // ---- デスクトップのレス一覧の位置調整(ReaCastの中で開かれた時だけ) ----
    let adjusting = false;
    const SAMPLE = [
      { no: 121, name: '名無しさん', date: '', body: 'コメント一覧の表示位置サンプル', source: 'bbs' },
      { no: 122, name: '名無しさん', date: '', body: 'ドラッグで動かせます', source: 'bbs' },
      { no: 123, name: '名無しさん', date: '', body: '右下の角で大きさを変えられます', source: 'bbs' },
    ];
    function setAdjusting(on) {
      adjusting = !!on;
      document.body.classList.toggle('adjusting', adjusting);
      // まだレスが無い時は、大きさの目安になるようにサンプルを出す
      if (adjusting && !items.length) {
        const real = items;
        items = SAMPLE.slice();
        render();
        items = real;
      } else {
        render();
      }
    }
    const tauri = window.__TAURI__;
    if (DESKTOP) {
      const win = tauri.window.getCurrentWindow();
      document.getElementById('adjust').addEventListener('mousedown', (e) => {
        if (e.button !== 0 || e.target.closest('button') || e.target.id === 'grip') return;
        win.startDragging();
      });
      document.getElementById('grip').addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        win.startResizeDragging('SouthEast');
      });
      document.getElementById('adjustDone').addEventListener('click', () => {
        tauri.core.invoke('comments_desktop_adjust', { on: false, target: 'list' });
      });
      tauri.event.listen('dlist:adjust', (e) => setAdjusting(e.payload));
      tauri.event.listen('dlist:interactive', (e) => setInteractive(e.payload));
      tauri.core.invoke('comments_list_interactive').then(setInteractive).catch(() => {});
      tauri.core.invoke('comments_desktop_adjusting', { target: 'list' }).then(setAdjusting).catch(() => {});
    }

    // ---- 「ウィンドウにする」(デスクトップのコメント一覧をマウスで操作する) ----
    // ホイールで過去のコメントを見返し、右クリックでもう一度読み上げる・NGなど
    let interactive = false;
    const moreEl = document.getElementById('more');
    const menuEl = document.getElementById('menu');
    const toastEl = document.getElementById('toast');
    const readingEl = document.getElementById('reading');
    const readingInput = document.getElementById('readingInput');

    function setInteractive(on) {
      interactive = !!on && DESKTOP;
      document.body.classList.toggle('interactive', interactive);
      if (!interactive && offset) {
        offset = 0;
        render();
      }
      if (!interactive) closeMenu();
    }

    function renderMore() {
      const show = interactive && offset > 0;
      moreEl.classList.toggle('visible', show);
      if (!show) return;
      // 最新のコメントがある側(新しい順なら上、古い順なら下)に出す
      moreEl.classList.toggle('top', !!style.list.newestFirst);
      const newer = Math.min(offset, items.length);
      moreEl.textContent = `過去のコメントを表示中(新しいコメント ${newer}件) クリックで最新へ`;
    }
    moreEl.addEventListener('click', () => {
      offset = 0;
      render();
    });

    /** 過去のコメントの方へn件動かす(マイナスなら新しい方へ) */
    function scrollOlder(n) {
      const max = Math.max(0, items.length - maxItems());
      const next = Math.max(0, Math.min(max, offset + n));
      if (next !== offset) {
        offset = next;
        render();
      }
    }
    /** 画面の上の方へn件(新しい順なら新しい方、古い順なら古い方) */
    function scrollUp(n) {
      scrollOlder(style.list.newestFirst ? -n : n);
    }

    // ホイール1段(だいたい100)で1件ずつ。タッチパッドの細かい動きは溜めてから動かす
    let wheelAcc = 0;
    window.addEventListener(
      'wheel',
      (e) => {
        if (!interactive || adjusting) return;
        e.preventDefault();
        closeMenu();
        wheelAcc += e.deltaY;
        const steps = Math.trunc(wheelAcc / 60);
        if (!steps) return;
        wheelAcc -= steps * 60;
        // 上に回すと画面の上の方のコメントへ
        scrollUp(-steps);
      },
      { passive: false },
    );

    // キーボード(一覧をクリックしてから): ↑↓で1件、PageUp・PageDownで1画面分、Homeで一番古い、Endで最新
    window.addEventListener('keydown', (e) => {
      if (!interactive || adjusting || readingEl.classList.contains('visible')) return;
      const page = Math.max(1, maxItems() - 1);
      const keys = {
        ArrowUp: () => scrollUp(1),
        ArrowDown: () => scrollUp(-1),
        PageUp: () => scrollUp(page),
        PageDown: () => scrollUp(-page),
        Home: () => scrollOlder(items.length),
        End: () => scrollOlder(-items.length),
      };
      if (keys[e.key]) {
        e.preventDefault();
        keys[e.key]();
      }
    });
    // 上の帯のボタン(1画面分ずつ)
    document.getElementById('barOlder').addEventListener('click', () => scrollOlder(Math.max(1, maxItems() - 1)));
    document.getElementById('barNewer').addEventListener('click', () => scrollOlder(-Math.max(1, maxItems() - 1)));
    document.getElementById('barLatest').addEventListener('click', () => scrollOlder(-items.length));

    function toast(text) {
      toastEl.textContent = text;
      toastEl.classList.add('visible');
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(() => toastEl.classList.remove('visible'), 3500);
    }

    function closeMenu() {
      menuEl.classList.remove('visible');
    }

    function invoke(cmd, args) {
      return tauri.core.invoke(cmd, args);
    }

    async function addLine(key, line, done, already) {
      try {
        const added = await invoke('comments_add_setting_line', { key, line });
        toast(added ? done : already);
        return added;
      } catch (err) {
        toast(String(err));
        return false;
      }
    }

    /** 読み方の単語部分は正規表現なので、記号はそのままの文字として扱うようにする */
    function escapeRegExp(s) {
      return s.replace(/[.*+?^${}()|[\]\\/]/g, '\\$&');
    }

    let readingWord = '';
    function openReading(word) {
      readingWord = word;
      document.getElementById('readingWord').textContent = word;
      readingInput.value = '';
      readingEl.classList.add('visible');
      readingInput.focus();
    }
    function submitReading() {
      const reading = readingInput.value.trim();
      readingEl.classList.remove('visible');
      addLine('readingRules', `${escapeRegExp(readingWord)}/${reading}`, `「${readingWord}」の読み方を登録しました`, '既に同じ読み方が登録されています');
    }
    document.getElementById('readingOk').addEventListener('click', submitReading);
    document.getElementById('readingCancel').addEventListener('click', () => readingEl.classList.remove('visible'));
    readingInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) submitReading();
      if (e.key === 'Escape') readingEl.classList.remove('visible');
    });

    async function copyText(text, done) {
      try {
        await navigator.clipboard.writeText(text);
        toast(done);
      } catch (err) {
        toast(`コピーできませんでした: ${err}`);
      }
    }

    /** この人のコメントを読まない(読まない人に足して、一覧からも消す) */
    async function banPerson(res, label) {
      const ok = await addLine('ngPeople', res.person, `${label}のコメントを読まないようにしました`, `${label}は既に読まない人に入っています`);
      if (ok) {
        items = items.filter((x) => x.person !== res.person);
        render();
      }
    }

    function openMenu(e, res) {
      const selected = String(window.getSelection() || '').trim().replace(/\s*\n\s*/g, ' ');
      const short = selected.slice(0, 20);
      const bbs = res.source === 'bbs';
      const id = bbs ? (String(res.date || '').match(/ID:([^\s]+)/) || [])[1] : '';
      // 掲示板はIDがある時だけ(名前だけだと「名無しさん」を全員読まなくなるので)
      const person = res.person && (!bbs || id) ? res.person : '';
      const who = bbs ? `ID:${id}` : res.name ? `「${res.name.slice(0, 16)}」` : '';
      // nullは区切り線
      const list = [
        [selected ? `「${short}」をコピー` : '文字を選んでから右クリックするとコピーできます', selected ? () => copyText(selected, `「${short}」をコピーしました`) : null],
        ['このコメントの本文をコピー', res.body ? () => copyText(res.body, '本文をコピーしました') : null],
        [selected ? `「${short}」をGoogleで検索` : '文字を選んでから右クリックすると検索できます', selected ? () => invoke('comments_search_web', { text: selected }).catch((err) => toast(String(err))) : null],
        null,
        ['もう一度読み上げる', () => invoke('comments_replay_res', { res }).then(() => toast('もう一度読み上げます'), (err) => toast(String(err)))],
        [
          bbs && res.no > 0 && !res.sub ? `ここから読み始める(レス${res.no}〜)` : 'ここから読み始める(1つ目の掲示板のレスだけ)',
          bbs && res.no > 0 && !res.sub
            ? () => invoke('comments_read_from', { no: res.no }).then((n) => toast(`レス${res.no}から読み上げ直します(${n}件)`), (err) => toast(String(err)))
            : null,
        ],
        null,
        [selected ? `「${short}」をNGワードに追加` : '文字を選んでから右クリックするとNGワードに追加できます', selected ? () => addLine('ngWords', selected, `「${short}」をNGワードに追加しました`, `「${short}」は既にNGワードにあります`) : null],
        [selected ? `「${short}」の読み方を登録…` : '文字を選んでから右クリックすると読み方を登録できます', selected ? () => openReading(selected) : null],
        bbs ? [res.name ? `名前「${res.name.slice(0, 16)}」をNGワードに追加` : '名前がありません', res.name ? () => addLine('ngWords', res.name, `名前「${res.name.slice(0, 16)}」をNGワードに追加しました`, 'その名前は既にNGワードにあります') : null] : undefined,
        [person ? `この人(${who})のコメントを読まない` : bbs ? 'IDが無いので、この人だけを読まないことはできません' : 'この人のコメントを読まない', person ? () => banPerson(res, who) : null],
      ];
      menuEl.textContent = '';
      for (const item of list) {
        if (item === undefined) continue;
        if (!item) {
          menuEl.appendChild(document.createElement('hr'));
          continue;
        }
        const [label, action] = item;
        const b = document.createElement('button');
        b.textContent = label;
        b.disabled = !action;
        if (action) {
          b.addEventListener('click', () => {
            closeMenu();
            action();
          });
        }
        menuEl.appendChild(b);
      }
      menuEl.classList.add('visible');
      // 窓からはみ出さないように位置を決める
      const { offsetWidth: w, offsetHeight: h } = menuEl;
      menuEl.style.left = `${Math.max(4, Math.min(e.clientX, window.innerWidth - w - 4))}px`;
      menuEl.style.top = `${Math.max(4, Math.min(e.clientY, window.innerHeight - h - 4))}px`;
    }

    if (DESKTOP) {
      // 上の帯を掴んで移動、右下の角で大きさを変える。動かした位置は少し待ってから保存する
      // (動かしている最中に、ReaCastが前の位置へ戻さないように知らせておく)
      const win = tauri.window.getCurrentWindow();
      document.getElementById('bar').addEventListener('mousedown', (e) => {
        if (e.button !== 0 || e.target.closest('button')) return;
        userMoveUntil = Date.now() + 15000;
        tauri.core.invoke('comments_desktop_moved', { save: false }).catch(() => {});
        win.startDragging();
      });
      document.getElementById('igrip').addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        userMoveUntil = Date.now() + 15000;
        tauri.core.invoke('comments_desktop_moved', { save: false }).catch(() => {});
        win.startResizeDragging('SouthEast');
      });
      let moveSaveTimer = null;
      let lastMoved = 0;
      // 帯・角を掴んだ後の動きだけを保存する(ReaCastが窓を置き直した時は保存しない)
      let userMoveUntil = 0;
      const onMoved = () => {
        const now = Date.now();
        if (!interactive || adjusting || now > userMoveUntil) return;
        userMoveUntil = Math.max(userMoveUntil, now + 2000);
        if (now - lastMoved > 500) {
          lastMoved = now;
          tauri.core.invoke('comments_desktop_moved', { save: false }).catch(() => {});
        }
        clearTimeout(moveSaveTimer);
        moveSaveTimer = setTimeout(() => tauri.core.invoke('comments_desktop_moved', { save: true }).catch(() => {}), 600);
      };
      if (win.onMoved) win.onMoved(onMoved);
      if (win.onResized) win.onResized(onMoved);
      window.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (!interactive || adjusting) return;
        const el = e.target.closest('.item');
        if (el && el._res && !el._res.system) openMenu(e, el._res);
        else closeMenu();
      });
      document.addEventListener('mousedown', (e) => {
        if (!menuEl.contains(e.target)) closeMenu();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeMenu();
      });
      window.addEventListener('blur', closeMenu);
    }
  </script>
</body>
</html>
