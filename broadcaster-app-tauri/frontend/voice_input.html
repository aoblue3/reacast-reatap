<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="data:," />
<title>ReaCast 話した字幕(音声認識)</title>
<!--
  話した字幕: ReaCastがEdgeで開く音声認識の画面(src-tauri/src/voice.rs)。
  ReaCastの画面(WebView2)ではブラウザの音声認識が使えないため、Edgeで開いて
  聞き取った文字をobs_bridgeのWebSocketでReaCastへ送る。この窓を閉じると止まる。
-->
<style>
  body { margin: 0; padding: 14px; font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 13px; background: #1c1d22; color: #e6e6ea; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  #state { font-weight: bold; }
  #state.ok { color: #7dff9a; }
  #state.ng { color: #ff8a8a; }
  #state.wait { color: #ffd36b; }
  #text { margin-top: 10px; min-height: 3em; padding: 8px; border-radius: 6px; background: #15161a; white-space: pre-wrap; }
  #meter { margin-top: 8px; height: 8px; border-radius: 4px; background: #15161a; overflow: hidden; }
  #meterBar { height: 100%; width: 0; background: #7dff9a; transition: width 0.15s; }
  #mic { color: #8d909c; font-size: 12px; margin-top: 4px; }
  .hint { color: #8d909c; font-size: 12px; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
  <h1>ReaCast 話した字幕</h1>
  <div>状態: <span id="state" class="wait">準備中…</span></div>
  <div id="meter"><div id="meterBar"></div></div>
  <div id="mic"></div>
  <div id="text"></div>
  <div class="hint">この窓は最小化しておいて大丈夫です(閉じると字幕が止まります)。止める時はReaCastの「話した字幕を使う」をOFFにしてください。</div>
  <script>
    'use strict';
    const WS_URL = 'ws://127.0.0.1:18771';
    const lang = new URLSearchParams(location.search).get('lang') || 'ja-JP';
    const stateEl = document.getElementById('state');
    const textEl = document.getElementById('text');
    const meterBar = document.getElementById('meterBar');
    const micEl = document.getElementById('mic');
    const params = new URLSearchParams(location.search);
    // マイク・声の増幅・自動音量調整(ReaCastの設定)
    const micName = params.get('mic') || '';
    const gain = Math.min(4, Math.max(1, Number(params.get('gain')) || 1));
    const agc = params.get('agc') !== '0';
    // Chromeの時だけ、マイクの音をこの画面で受け取って加工してから音声認識に渡す
    // (Edgeは渡すと「network」のエラーになって聞き取れなかった。2026-10-28に確認)。
    // 設定が今まで通り(既定のマイク・1倍・自動音量調整ON)なら、ブラウザに任せる
    const isEdge = /Edg\//.test(navigator.userAgent);
    const useTrack = !isEdge && (micName !== '' || gain !== 1 || !agc);
    let ws = null;
    let lastState = null;

    function send(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
    }

    function setState(state, message) {
      // 止めている間に、聞き取りの終わり際の結果などで「聞き取り中」に戻さない
      if (muted && state === 'listening') return;
      stateEl.textContent = message;
      // 最小化していてもタスクバーで状態が分かるように、窓のタイトルにも出す
      document.title = `話した字幕: ${message}`;
      stateEl.className = state === 'listening' ? 'ok' : state === 'error' || state === 'unsupported' ? 'ng' : 'wait';
      lastState = { type: 'voiceStatus', state, message };
      send(lastState);
    }

    // マイクを止めている(ReaCastのホットキー・ボタンから届く voiceControl)
    // ReaCastが「マイクを止めている」状態で開いた時は、止めた状態から始める(聞き取りを始めない)
    let muted = new URLSearchParams(location.search).get('muted') === '1';
    let rec = null;
    // 聞き取り途中(まだ確定していない)の言葉。区切られた時に捨てずに確定として送る
    let pendingInterim = '';
    // 聞き取りが動いているか・始めた時刻・最後に声を聞き取った時刻(止まった時の見張り用)
    let running = false;
    let startedAt = 0;
    let lastHeardAt = 0;
    let endedAt = 0;
    // 1文確定して、聞き取りを新しくしている途中
    let renewing = false;

    // ---- マイクの音(音量メーター。Chromeの時は音声認識にもこの音を渡す) ----
    let audio = null;
    let audioOpening = null;

    /** マイクの一覧(名前)をReaCastに知らせる(設定画面の「マイク」に出す) */
    async function sendDevices() {
      try {
        const list = (await navigator.mediaDevices.enumerateDevices())
          .filter((d) => d.kind === 'audioinput' && d.deviceId !== 'default' && d.deviceId !== 'communications' && d.label)
          .map((d) => d.label);
        send({ type: 'voiceDevices', devices: [...new Set(list)] });
      } catch (_) {}
    }

    /** マイクを開く(メーター・音声認識に渡す音)。開いていれば何もしない */
    function openAudio() {
      if (audio && audio.track.readyState === 'live') return Promise.resolve(audio);
      if (audioOpening) return audioOpening;
      audioOpening = (async () => {
        closeAudio();
        let deviceId;
        let note = '';
        if (micName) {
          // 名前は、許可をもらった後でないと分からない(この窓は自動で許可される)
          const probe = await navigator.mediaDevices.getUserMedia({ audio: true });
          probe.getTracks().forEach((t) => t.stop());
          const found = (await navigator.mediaDevices.enumerateDevices()).find((d) => d.kind === 'audioinput' && d.label === micName);
          if (found) deviceId = found.deviceId;
          else note = '(選んだマイクが見つからないので、既定のマイク)';
        }
        const constraints = useTrack
          ? { deviceId: deviceId ? { exact: deviceId } : undefined, autoGainControl: agc, noiseSuppression: true, echoCancellation: true }
          : true;
        const stream = await navigator.mediaDevices.getUserMedia({ audio: constraints });
        const track = stream.getAudioTracks()[0];
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') await ctx.resume().catch(() => {});
        const src = ctx.createMediaStreamSource(stream);
        const amp = ctx.createGain();
        amp.gain.value = useTrack ? gain : 1;
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;
        src.connect(amp);
        amp.connect(analyser);
        let out = null;
        if (useTrack) {
          const dest = ctx.createMediaStreamDestination();
          amp.connect(dest);
          out = dest.stream.getAudioTracks()[0];
        }
        audio = { stream, ctx, track, analyser, out };
        // マイクが抜かれた時は、聞き取りを区切って開き直す
        track.onended = () => {
          closeAudio();
          try { rec && rec.abort(); } catch (_) {}
        };
        micEl.textContent = `マイク: ${track.label || '既定のマイク'}${note}${useTrack ? `・${gain}倍${agc ? '' : '・自動音量調整OFF'}` : ''}`;
        sendDevices();
        return audio;
      })().finally(() => (audioOpening = null));
      return audioOpening;
    }

    function closeAudio() {
      if (!audio) return;
      audio.stream.getTracks().forEach((t) => t.stop());
      audio.ctx.close().catch(() => {});
      audio = null;
      meterBar.style.width = '0';
    }

    // 声の大きさ(0〜1)。-60dB〜0dBを0〜1にする。4回/秒ReaCastに送る(設定画面のメーター)
    const meterBuf = new Float32Array(1024);
    setInterval(() => {
      if (!audio || muted) return;
      audio.analyser.getFloatTimeDomainData(meterBuf);
      let sum = 0;
      for (const v of meterBuf) sum += v * v;
      const rms = Math.sqrt(sum / meterBuf.length);
      const level = rms > 0 ? Math.min(1, Math.max(0, (20 * Math.log10(rms) + 60) / 60)) : 0;
      meterBar.style.width = `${Math.round(level * 100)}%`;
      meterBar.style.background = level > 0.9 ? '#ff8a8a' : '#7dff9a';
      send({ type: 'voiceLevel', level: Math.round(level * 100) / 100 });
    }, 250);
    navigator.mediaDevices && navigator.mediaDevices.addEventListener('devicechange', sendDevices);

    /** 聞き取りを始める(既に始まっている時の例外は無視。すぐ始められなければ少し後にもう一度) */
    function startRec() {
      if (!rec || muted) return;
      openAudio().then(
        (a) => {
          if (muted) return;
          const begin = () => (useTrack && a.out ? rec.start(a.out) : rec.start());
          try {
            begin();
          } catch (_) {
            setTimeout(() => {
              if (!running && !muted) {
                try { begin(); } catch (_) {}
              }
            }, 150);
          }
        },
        (err) => {
          // マイクを開けない時は、ブラウザに任せて聞き取る(メーターは出ない)
          micEl.textContent = `マイクを開けませんでした: ${(err && err.name) || err}`;
          if (useTrack) setState('error', `マイクを開けませんでした(${(err && err.name) || err})。「マイク」の設定を確認してください`);
          else {
            try { rec.start(); } catch (_) {}
          }
        },
      );
    }

    function connect() {
      ws = new WebSocket(WS_URL);
      // 繋がったら今の状態を知らせる(ReaCastの設定画面に表示される)
      ws.onopen = () => lastState && send(lastState);
      ws.onclose = () => setTimeout(connect, 1500);
      ws.onmessage = (e) => {
        let msg;
        try {
          msg = JSON.parse(e.data);
        } catch (_) {
          return;
        }
        if (msg.type !== 'voiceControl' || !rec) return;
        const nextMuted = !msg.listening;
        if (nextMuted === muted) return;
        muted = nextMuted;
        if (muted) {
          // 聞き取り自体を止める(声がサーバーに送られないように)
          pendingInterim = '';
          try { rec.abort(); } catch (_) {}
          // マイク自体も閉じる(メーターも止まる)
          closeAudio();
          textEl.textContent = '';
          setState('muted', 'マイクを止めています');
        } else {
          startRec();
        }
      };
    }
    connect();

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setState('unsupported', 'このブラウザは音声認識に対応していません');
    } else {
      rec = new SR();
      rec.lang = lang;
      rec.continuous = true;
      rec.interimResults = true;
      let fatal = false;

      rec.onstart = () => {
        running = true;
        startedAt = Date.now();
        setState('listening', `聞き取り中(${lang})`);
      };
      rec.onresult = (e) => {
        // 聞き取れているなら、通信は大丈夫
        networkErrors = [];
        lastHeardAt = Date.now();
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const r = e.results[i];
          const text = r[0].transcript.trim();
          if (!text) continue;
          if (r.isFinal) {
            textEl.textContent = text;
            pendingInterim = '';
            send({ type: 'voiceInput', text, final: true });
            // 1文確定したら、聞き取りを新しくする(onendですぐ聞き直す)。同じ聞き取りのまま
            // 同じ言葉を繰り返すと(「こんにちは」を続けて言う等)、Chromeは2回目以降を空の
            // 結果で返して、字幕が出なかった(2026-10-28に確認。新しくすると全部聞き取れた)
            if (!renewing) {
              renewing = true;
              try { rec.stop(); } catch (_) {}
            }
          } else {
            interim += text;
          }
        }
        if (interim) {
          pendingInterim = interim;
          textEl.textContent = interim;
          send({ type: 'voiceInput', text: interim, final: false });
        }
      };
      // 「サーバーに繋がらない」が起きた時刻(直近2分)。黙っている間にEdge側が
      // 接続を切ると数十秒おきに起きるが、すぐ聞き直して戻るので、それだけでは
      // エラーとして出さない(2分に3回以上続いた時だけ本当の通信トラブルとして出す)
      let networkErrors = [];
      rec.onerror = (e) => {
        // 黙っている時(no-speech)や途中で切れた時(aborted)は、そのまま続けて聞き直す
        if (e.error === 'no-speech' || e.error === 'aborted') return;
        if (e.error === 'network') {
          const now = Date.now();
          networkErrors = networkErrors.filter((t) => now - t < 120000);
          networkErrors.push(now);
          if (networkErrors.length < 3) return;
        }
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          fatal = true;
          setState('error', 'マイクが使えません(マイクの接続と、Windowsのマイクの許可を確認してください)');
        } else if (e.error === 'audio-capture') {
          setState('error', 'マイクが見つかりません');
        } else if (e.error === 'network') {
          setState('error', '音声認識のサーバーに繋がりません(インターネット接続を確認してください)');
        } else {
          setState('error', `音声認識のエラー: ${e.error}`);
        }
      };
      // ブラウザは一定時間で聞き取りを区切ってしまう。区切られた時に聞き取り途中の言葉が
      // 残っていたら、捨てずに確定として送る(話している途中で区切られると、その言葉が
      // 丸ごと消えて「話したのに字幕が出ない」ことがあったため)。待たずにすぐ聞き直す
      rec.onend = () => {
        running = false;
        renewing = false;
        endedAt = Date.now();
        if (pendingInterim && !muted) {
          send({ type: 'voiceInput', text: pendingInterim, final: true });
          pendingInterim = '';
        }
        if (!fatal && !muted) startRec();
      };
      // 見張り(2秒おき):
      // ・長く聞き続けると、聞き取り中のまま結果を返さなくなることがある(Chromeでよく
      //   知られている問題)。黙っている間に、45秒ごとに聞き取りを新しくする
      // ・聞き取り途中の言葉のまま固まっていたら、区切る(途中の言葉は確定として送られる)
      // ・止まったまま始め直せていなければ、始め直す
      setInterval(() => {
        if (fatal || muted) return;
        const now = Date.now();
        if (running) {
          const quiet = !pendingInterim && now - lastHeardAt > 3000;
          // 聞き取り途中の言葉が8秒以上変わらないのは、固まっている(区切ると確定として送られる)
          const stuck = !!pendingInterim && now - lastHeardAt > 8000;
          if ((quiet && now - startedAt > 45000) || stuck) {
            try { rec.stop(); } catch (_) {}
          }
        } else if (now - endedAt > 2000) {
          startRec();
        }
      }, 2000);
      if (muted) {
        setState('muted', 'マイクを止めています');
      } else {
        startRec();
      }
    }
  </script>
</body>
</html>
