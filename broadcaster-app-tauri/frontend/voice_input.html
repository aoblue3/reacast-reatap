<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="data:," />
<title>ReaCast 話した字幕(音声認識)</title>
<!--
  話した字幕: ReaCastがEdgeで開く音声認識の画面(src-tauri/src/voice.rs)。
  ReaCastの画面(WebView2)ではブラウザの音声認識が使えないため、Edgeで開いて
  聞き取った文字をobs_bridgeのWebSocketでReaCastへ送る。この窓を閉じると止まる。
-->
<style>
  body { margin: 0; padding: 14px; font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 13px; background: #1c1d22; color: #e6e6ea; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  #state { font-weight: bold; }
  #state.ok { color: #7dff9a; }
  #state.ng { color: #ff8a8a; }
  #state.wait { color: #ffd36b; }
  #text { margin-top: 10px; min-height: 3em; padding: 8px; border-radius: 6px; background: #15161a; white-space: pre-wrap; }
  .hint { color: #8d909c; font-size: 12px; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
  <h1>ReaCast 話した字幕</h1>
  <div>状態: <span id="state" class="wait">準備中…</span></div>
  <div id="text"></div>
  <div class="hint">この窓は最小化しておいて大丈夫です(閉じると字幕が止まります)。止める時はReaCastの「話した字幕を使う」をOFFにしてください。</div>
  <script>
    'use strict';
    const WS_URL = 'ws://127.0.0.1:18771';
    const lang = new URLSearchParams(location.search).get('lang') || 'ja-JP';
    const stateEl = document.getElementById('state');
    const textEl = document.getElementById('text');
    let ws = null;
    let lastState = null;

    function send(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
    }

    function setState(state, message) {
      // 止めている間に、聞き取りの終わり際の結果などで「聞き取り中」に戻さない
      if (muted && state === 'listening') return;
      stateEl.textContent = message;
      // 最小化していてもタスクバーで状態が分かるように、窓のタイトルにも出す
      document.title = `話した字幕: ${message}`;
      stateEl.className = state === 'listening' ? 'ok' : state === 'error' || state === 'unsupported' ? 'ng' : 'wait';
      lastState = { type: 'voiceStatus', state, message };
      send(lastState);
    }

    // マイクを止めている(ReaCastのホットキー・ボタンから届く voiceControl)
    let muted = false;
    let rec = null;
    // 聞き取り途中(まだ確定していない)の言葉。区切られた時に捨てずに確定として送る
    let pendingInterim = '';
    // 聞き取りが動いているか・始めた時刻・最後に声を聞き取った時刻(止まった時の見張り用)
    let running = false;
    let startedAt = 0;
    let lastHeardAt = 0;
    let endedAt = 0;

    /** 聞き取りを始める(既に始まっている時の例外は無視。すぐ始められなければ少し後にもう一度) */
    function startRec() {
      if (!rec || muted) return;
      try {
        rec.start();
      } catch (_) {
        setTimeout(() => {
          if (!running && !muted) {
            try { rec.start(); } catch (_) {}
          }
        }, 150);
      }
    }

    function connect() {
      ws = new WebSocket(WS_URL);
      // 繋がったら今の状態を知らせる(ReaCastの設定画面に表示される)
      ws.onopen = () => lastState && send(lastState);
      ws.onclose = () => setTimeout(connect, 1500);
      ws.onmessage = (e) => {
        let msg;
        try {
          msg = JSON.parse(e.data);
        } catch (_) {
          return;
        }
        if (msg.type !== 'voiceControl' || !rec) return;
        const nextMuted = !msg.listening;
        if (nextMuted === muted) return;
        muted = nextMuted;
        if (muted) {
          // 聞き取り自体を止める(声がサーバーに送られないように)
          pendingInterim = '';
          try { rec.abort(); } catch (_) {}
          textEl.textContent = '';
          setState('muted', 'マイクを止めています');
        } else {
          startRec();
        }
      };
    }
    connect();

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setState('unsupported', 'このブラウザは音声認識に対応していません');
    } else {
      rec = new SR();
      rec.lang = lang;
      rec.continuous = true;
      rec.interimResults = true;
      let fatal = false;

      rec.onstart = () => {
        running = true;
        startedAt = Date.now();
        setState('listening', `聞き取り中(${lang})`);
      };
      rec.onresult = (e) => {
        // 聞き取れているなら、通信は大丈夫
        networkErrors = [];
        lastHeardAt = Date.now();
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const r = e.results[i];
          const text = r[0].transcript.trim();
          if (!text) continue;
          if (r.isFinal) {
            textEl.textContent = text;
            pendingInterim = '';
            send({ type: 'voiceInput', text, final: true });
          } else {
            interim += text;
          }
        }
        if (interim) {
          pendingInterim = interim;
          textEl.textContent = interim;
          send({ type: 'voiceInput', text: interim, final: false });
        }
      };
      // 「サーバーに繋がらない」が起きた時刻(直近2分)。黙っている間にEdge側が
      // 接続を切ると数十秒おきに起きるが、すぐ聞き直して戻るので、それだけでは
      // エラーとして出さない(2分に3回以上続いた時だけ本当の通信トラブルとして出す)
      let networkErrors = [];
      rec.onerror = (e) => {
        // 黙っている時(no-speech)や途中で切れた時(aborted)は、そのまま続けて聞き直す
        if (e.error === 'no-speech' || e.error === 'aborted') return;
        if (e.error === 'network') {
          const now = Date.now();
          networkErrors = networkErrors.filter((t) => now - t < 120000);
          networkErrors.push(now);
          if (networkErrors.length < 3) return;
        }
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          fatal = true;
          setState('error', 'マイクが使えません(マイクの接続と、Windowsのマイクの許可を確認してください)');
        } else if (e.error === 'audio-capture') {
          setState('error', 'マイクが見つかりません');
        } else if (e.error === 'network') {
          setState('error', '音声認識のサーバーに繋がりません(インターネット接続を確認してください)');
        } else {
          setState('error', `音声認識のエラー: ${e.error}`);
        }
      };
      // ブラウザは一定時間で聞き取りを区切ってしまう。区切られた時に聞き取り途中の言葉が
      // 残っていたら、捨てずに確定として送る(話している途中で区切られると、その言葉が
      // 丸ごと消えて「話したのに字幕が出ない」ことがあったため)。待たずにすぐ聞き直す
      rec.onend = () => {
        running = false;
        endedAt = Date.now();
        if (pendingInterim && !muted) {
          send({ type: 'voiceInput', text: pendingInterim, final: true });
          pendingInterim = '';
        }
        if (!fatal && !muted) startRec();
      };
      // 見張り(2秒おき):
      // ・長く聞き続けると、聞き取り中のまま結果を返さなくなることがある(Chromeでよく
      //   知られている問題)。黙っている間に、45秒ごとに聞き取りを新しくする
      // ・聞き取り途中の言葉のまま固まっていたら、区切る(途中の言葉は確定として送られる)
      // ・止まったまま始め直せていなければ、始め直す
      setInterval(() => {
        if (fatal || muted) return;
        const now = Date.now();
        if (running) {
          const quiet = !pendingInterim && now - lastHeardAt > 3000;
          // 聞き取り途中の言葉が8秒以上変わらないのは、固まっている(区切ると確定として送られる)
          const stuck = !!pendingInterim && now - lastHeardAt > 8000;
          if ((quiet && now - startedAt > 45000) || stuck) {
            try { rec.stop(); } catch (_) {}
          }
        } else if (now - endedAt > 2000) {
          startRec();
        }
      }, 2000);
      try {
        rec.start();
      } catch (err) {
        setState('error', `音声認識を始められませんでした: ${err.message || err}`);
      }
    }
  </script>
</body>
</html>
