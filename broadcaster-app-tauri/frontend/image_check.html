<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="data:," />
<title>ReaCast 画像の確認</title>
<!--
  コメント一覧の画像を、配信者にだけ見せる小さな窓(image_check.rs)。この窓は画面キャプチャ・
  画面共有に映らない。「見せる」(ボタンかホットキー)を押した画像だけ、コメント一覧の暗幕が外れる。
  押さなければ、設定の秒数(style.list.imageCheckSeconds)で次の画像へ進む(暗幕のまま)。
-->
<style>
  html, body { margin: 0; height: 100%; background: #1c1d22; color: #e6e7eb; font: 13px "Yu Gothic UI", "Meiryo", sans-serif; overflow: hidden; user-select: none; }
  body { display: flex; flex-direction: column; border: 1px solid #3a3c45; box-sizing: border-box; }
  #bar { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 10px; background: #26272e; cursor: move; }
  #title { font-weight: bold; }
  #waiting { color: #9a9daa; font-size: 12px; margin-left: auto; }
  #close { border: none; background: transparent; color: #c9cbd3; font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
  #close:hover { background: #3a3c45; }
  #pic { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #pic img { max-width: 100%; max-height: 100%; object-fit: contain; }
  [hidden] { display: none !important; }
  /* 動く画像: 全部のコマを並べる */
  #pic.frames { display: block; overflow-y: auto; background: #111; }
  #fhead { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 6px; padding: 4px 6px; background: #26272e; font-size: 12px; color: #c9cbd3; }
  #fhead button { margin-left: auto; border: 1px solid #4a4c56; background: transparent; color: #d6d8df; font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 3px; padding: 4px; }
  /* 5コマ: 窓の大きさに合わせて、上の段(最初・中盤)を大きめ、下の段(最後の3コマ)を小さめに */
  #grid.pick { grid-template-columns: repeat(6, 1fr); grid-template-rows: 3fr 2fr; height: calc(100% - 26px); box-sizing: border-box; }
  #grid.pick .f { grid-column: span 2; aspect-ratio: auto; min-height: 0; }
  #grid.pick .f:nth-child(-n+2) { grid-column: span 3; }
  #grid .f { position: relative; background: #000; display: flex; align-items: center; justify-content: center; aspect-ratio: 1; }
  #grid canvas { max-width: 100%; max-height: 100%; }
  #grid .n { position: absolute; left: 2px; bottom: 1px; font-size: 10px; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
  #pic .play { width: 100%; height: calc(100% - 26px); display: flex; align-items: center; justify-content: center; }
  #timer { height: 3px; background: #3a3c45; }
  #timer div { height: 100%; width: 100%; background: #5b8def; transform-origin: left; }
  #foot { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
  #show { border: none; background: #3b6df0; color: #fff; font-weight: bold; font-size: 13px; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
  #show:hover { background: #4d7cf5; }
  #hide { border: 1px solid #4a4c56; background: transparent; color: #d6d8df; font-size: 13px; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
  #hide:hover { background: #33353d; }
  #key { color: #9a9daa; font-size: 11px; line-height: 1.35; }
</style>
</head>
<body>
  <div id="bar">
    <span id="title">🖼 画像</span>
    <span id="waiting"></span>
    <button id="close" title="見せないで次へ">×</button>
  </div>
  <div id="pic"></div>
  <div id="timer"><div></div></div>
  <div id="foot">
    <button id="show">見せる</button>
    <button id="hide">見せない</button>
    <span id="key"></span>
  </div>
<script src="shared/hotkey-forward.js"></script>
<script>
'use strict';
(() => {
  const tauri = window.__TAURI__;
  const invoke = tauri.core.invoke;
  // 何もしなければ、この時間で次の画像へ進む(暗幕のまま。コメント設定の「確認の待ち時間」。0=無制限)
  let waitMs = 0;
  const pic = document.getElementById('pic');
  const bar = document.querySelector('#timer div');
  let current = null;
  let timer = null;

  function decide(show) {
    if (!current) return;
    const id = current.id;
    clearTimeout(timer);
    invoke('image_check_decide', { id, show }).catch(() => {});
  }

  function render(state) {
    const next = state && state.current;
    if (state && state.seconds != null) waitMs = Math.max(0, Number(state.seconds) || 0) * 1000;
    if (state && typeof state.hotkey === 'string') {
      const fmt = (key) => String(key || '').split('+').filter(Boolean).map((t) => t.replace(/^Key/, '').replace(/^Digit/, '')).join('+');
      const show = fmt(state.hotkey);
      const hide = fmt(state.hotkeyHide);
      const parts = [show && `見せる: ${show}`, hide && `見せない: ${hide}`].filter(Boolean);
      document.getElementById('key').textContent = parts.length ? parts.join(' / ') : 'ホットキーは、コメント設定の「ホットキー」で割り当てられます';
    }
    document.getElementById('waiting').textContent = state && state.waiting ? `あと${state.waiting}枚` : '';
    if (next && current && next.id === current.id) return;
    current = next;
    clearTimeout(timer);
    pic.textContent = '';
    if (!current) return;
    document.getElementById('title').textContent = `🖼 画像 ${current.id}`;
    pic.classList.remove('frames');
    if (current.frames) {
      showFrames(current);
    } else {
      const img = document.createElement('img');
      img.src = current.src;
      img.title = current.url;
      pic.appendChild(img);
    }
    // 残り時間の帯(transformだけ動かす)。無制限の時は出さない
    document.getElementById('timer').style.visibility = waitMs ? 'visible' : 'hidden';
    if (!waitMs) return;
    bar.style.transition = 'none';
    bar.style.transform = 'scaleX(1)';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        bar.style.transition = `transform ${waitMs}ms linear`;
        bar.style.transform = 'scaleX(0)';
      });
    });
    timer = setTimeout(() => decide(false), waitMs);
  }

  // 動く画像(GIF・動くWebP)は、途中で絵を差し替えられる(最後にびっくり画像・えっちな画像で止まる、など)。
  // 最初は「最初・中盤・最後の3コマ」の5コマだけ大きめに並べる(2段目が最後の3コマ)。
  // 「全部のコマ」で、全部のコマを並べる(ほとんど同じコマが続く所は1つにまとめ、右下に「×まとめた数」)
  async function showFrames(cur) {
    const head = document.createElement('div');
    head.id = 'fhead';
    const info = document.createElement('span');
    info.textContent = `動く画像・${cur.frames}コマ: 読み込み中…`;
    const allBtn = document.createElement('button');
    allBtn.textContent = '全部のコマ';
    const toggle = document.createElement('button');
    toggle.textContent = '動きで見る';
    toggle.style.marginLeft = '0';
    head.append(info, allBtn, toggle);
    const grid = document.createElement('div');
    grid.id = 'grid';
    grid.className = 'pick';
    const play = document.createElement('div');
    play.className = 'play';
    play.hidden = true;
    const img = document.createElement('img');
    img.src = cur.src;
    img.title = cur.url;
    play.appendChild(img);
    pic.classList.add('frames');
    pic.append(head, grid, play);
    toggle.addEventListener('click', () => {
      play.hidden = !play.hidden;
      grid.hidden = !play.hidden;
      toggle.textContent = play.hidden ? '動きで見る' : 'コマで見る';
    });
    const still = () => current && current.id === cur.id;
    let dec = null;
    let count = 0;
    let busy = false;

    function tileOf(image, text) {
      const scale = Math.min(1, 240 / Math.max(image.displayWidth, image.displayHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(image.displayWidth * scale));
      c.height = Math.max(1, Math.round(image.displayHeight * scale));
      c.getContext('2d').drawImage(image, 0, 0, c.width, c.height);
      const tile = document.createElement('div');
      tile.className = 'f';
      const label = document.createElement('span');
      label.className = 'n';
      label.textContent = text;
      tile.append(c, label);
      return { tile, label };
    }

    // 最初・中盤・最後の3コマ(コマが5つ以下なら全部)
    async function showPick() {
      const n = count;
      const picks = n <= 5 ? [...Array(n).keys()] : [0, Math.floor((n - 1) / 2), n - 3, n - 2, n - 1];
      const name = (i) => (i === 0 ? '最初' : i >= n - 3 ? (i === n - 1 ? '最後' : `最後から${n - i}`) : '中盤');
      grid.className = n <= 5 ? 'all' : 'pick';
      grid.textContent = '';
      for (const i of picks) {
        const { image } = await dec.decode({ frameIndex: i, completeFramesOnly: true });
        if (!still()) return image.close();
        grid.appendChild(tileOf(image, n <= 5 ? String(i + 1) : `${name(i)} ${i + 1}`).tile);
        image.close();
      }
      info.textContent = `動く画像・全${n}コマ`;
    }

    // 全部のコマ(ほとんど同じコマが続く所はまとめる。少しでも違うコマは残す)
    async function showAll() {
      grid.className = 'all';
      grid.textContent = '';
      const probe = document.createElement('canvas');
      probe.width = probe.height = 32;
      const pctx = probe.getContext('2d', { willReadFrequently: true });
      let last = null;
      let lastTile = null;
      let kept = 0;
      for (let i = 0; i < count; i++) {
        const { image } = await dec.decode({ frameIndex: i, completeFramesOnly: true });
        if (!still()) return image.close();
        pctx.clearRect(0, 0, 32, 32);
        pctx.drawImage(image, 0, 0, 32, 32);
        const px = pctx.getImageData(0, 0, 32, 32).data;
        let same = false;
        if (last) {
          let sum = 0;
          let max = 0;
          for (let k = 0; k < px.length; k++) {
            const dlt = Math.abs(px[k] - last[k]);
            sum += dlt;
            if (dlt > max) max = dlt;
          }
          same = max < 40 && sum / px.length < 2;
        }
        if (same && lastTile) {
          lastTile.merged++;
          lastTile.label.textContent = `${lastTile.no} ×${lastTile.merged}`;
        } else {
          const t = tileOf(image, String(i + 1));
          grid.appendChild(t.tile);
          lastTile = { no: i + 1, merged: 1, label: t.label };
          kept++;
          last = px;
        }
        image.close();
      }
      info.textContent = kept < count ? `動く画像・全${count}コマ(同じコマをまとめて${kept}枚)` : `動く画像・全${count}コマ`;
    }

    allBtn.addEventListener('click', async () => {
      if (!dec || busy) return;
      busy = true;
      play.hidden = true;
      grid.hidden = false;
      toggle.textContent = '動きで見る';
      const toAll = grid.className !== 'all';
      allBtn.textContent = toAll ? '5コマだけ' : '全部のコマ';
      try {
        await (toAll ? showAll() : showPick());
      } catch (e) {}
      busy = false;
    });

    try {
      if (!('ImageDecoder' in window)) throw new Error('no ImageDecoder');
      const buf = await invoke('image_check_bytes', { id: cur.id });
      if (!still()) return;
      dec = new ImageDecoder({ data: buf, type: cur.mime });
      await dec.tracks.ready;
      count = dec.tracks.selectedTrack.frameCount;
      busy = true;
      await showPick();
      busy = false;
      if (count <= 5) allBtn.hidden = true;
    } catch (e) {
      busy = false;
      if (!still()) return;
      // コマを取り出せない時は、動きのまま見せる
      info.textContent = '動く画像: コマを並べられませんでした。動きを最後まで見てください';
      allBtn.hidden = true;
      toggle.hidden = true;
      grid.hidden = true;
      play.hidden = false;
    }
  }

  document.getElementById('show').addEventListener('click', () => decide(true));
  document.getElementById('hide').addEventListener('click', () => decide(false));
  document.getElementById('close').addEventListener('click', () => decide(false));
  document.getElementById('bar').addEventListener('mousedown', (e) => {
    if (e.button === 0 && !e.target.closest('button')) tauri.window.getCurrentWindow().startDragging();
  });
  // 変わった時は、ホットキー・待ち時間の設定も読み直す(窓は隠すだけで開いたままなので)
  tauri.event.listen('imagecheck:changed', () => invoke('image_check_state').then(render).catch(() => {}));
  invoke('image_check_state').then(render).catch(() => {});
})();
</script>
</body>
</html>
