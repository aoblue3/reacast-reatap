<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<!-- favicon.icoの読み込みエラーがログに出ないように -->
<link rel="icon" href="data:," />
<title>ReaCast 字幕</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  /* 字幕は既定で表示領域の上端から下へ出す(設定「縦の位置」で下端揃えにもできる。
     OBSでもデスクトップ字幕でも、ソース/ウィンドウの大きさで表示範囲を決める) */
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    pointer-events: none;
  }
  #box {
    --off: translate(0, 0);
    position: relative;
    max-width: 100%;
    max-height: 100%;
    box-sizing: border-box;
    padding: 0.15em 0.4em;
    line-height: 1.3;
    white-space: pre-wrap;
    word-break: break-word;
    opacity: 0;
    transition: opacity 120ms linear;
  }
  #box.visible { opacity: 1; }
  #box.instant { transition: none; }
  /* 字幕の出し方(設定「字幕の出し方」) */
  #box.appear-fade.visible { transition: opacity 350ms ease-out; }
  #box.appear-slide-left.visible { animation: slide-left 320ms ease-out; }
  #box.appear-slide-up.visible { animation: slide-up 320ms ease-out; }
  /* 位置の微調整でtransformを使っているので、スライドはleft/topで動かす
     (古いOBSのブラウザソースでも動くように、translateプロパティは使わない) */
  @keyframes slide-left {
    from { opacity: 0; left: -60px; }
    to { opacity: 1; left: 0; }
  }
  @keyframes slide-up {
    from { opacity: 0; top: 30px; }
    to { opacity: 1; top: 0; }
  }
  /* プリセットに合わせた出し方。位置の微調整(translate)は --off に入れてあるので、
     アニメーションの中でも同じ位置を保てる */
  /* 吹き出し: 左(キャラクターの側)から、ぽんっと膨らんで出てくる */
  #box.appear-pop-left.visible { transform-origin: left center; animation: pop-left 460ms cubic-bezier(.2, 1.5, .4, 1); }
  @keyframes pop-left {
    0% { opacity: 0; transform: var(--off) scale(0.15); }
    55% { opacity: 1; transform: var(--off) scale(1.07); }
    100% { opacity: 1; transform: var(--off) scale(1); }
  }
  /* P5風: 左から斜めに切り込んできて、ぴたっと止まる */
  #box.appear-p5-slash.visible { transform-origin: left center; animation: p5-slash 420ms cubic-bezier(.15, .9, .2, 1); }
  @keyframes p5-slash {
    0% { opacity: 0; transform: var(--off) translateX(-160px) skewX(-28deg); clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); }
    45% { opacity: 1; transform: var(--off) translateX(14px) skewX(-10deg); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
    70% { transform: var(--off) translateX(-4px) skewX(-3deg); }
    100% { opacity: 1; transform: var(--off); }
  }
  /* 今読んでいるスレッドのタイトル(設定でONの時だけ。位置は四隅・上下の真ん中から選ぶ) */
  #threadTitle { position: fixed; display: none; max-width: calc(100% - 16px); padding: 3px 9px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; line-height: 1.35; }
  #threadTitle.show { display: block; }
  /* 掲示板風: 回線が遅かった頃のページのように上から少しずつ読み込まれて、
     新着レスの黄色い色がすっと消える(背景の色は設定の色に戻る) */
  #box.appear-bbs-load.visible { animation: bbs-load 600ms steps(5, end), bbs-new 2000ms ease-out; }
  @keyframes bbs-load {
    from { clip-path: inset(0 0 100% 0); }
    to { clip-path: inset(0 0 0 0); }
  }
  @keyframes bbs-new { 0%, 35% { background-color: #ffffcc; } }
  /* FF風: ウィンドウが上下にカクカクと開く(スーパーファミコンのRPGのウィンドウ) */
  #box.appear-ff-open.visible { transform-origin: center; animation: ff-open 240ms steps(6, end); }
  @keyframes ff-open {
    0% { opacity: 1; transform: var(--off) scale(1, 0.05); }
    100% { opacity: 1; transform: var(--off) scale(1, 1); }
  }
  /* ネオン: ネオン管がチカチカっと点く */
  /* (速く・暗くまで点滅すると目に障るので、ゆっくり2回だけ、暗くなりすぎないように) */
  #box.appear-neon-flicker.visible { animation: neon-flicker 1400ms ease-in-out; }
  @keyframes neon-flicker {
    0% { opacity: 0; } 18% { opacity: 1; } 30% { opacity: 0.55; } 44% { opacity: 1; } 56% { opacity: 0.7; } 70% { opacity: 1; } 100% { opacity: 1; }
  }
  /* OC風: 右からバチッと飛び込んで、ビリッと揺れて止まる */
  #box.appear-oc-bolt.visible { transform-origin: right center; animation: oc-bolt 460ms cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes oc-bolt {
    0% { opacity: 0; transform: var(--off) translateX(110px) skewX(-16deg); }
    55% { opacity: 1; transform: var(--off) translateX(-10px) skewX(5deg); }
    70% { transform: var(--off) translateX(5px) rotate(-1deg); }
    85% { transform: var(--off) translateX(-2px) rotate(0.5deg); }
    100% { opacity: 1; transform: var(--off); }
  }
  /* オーロラ: ぼかしから、ふわっと浮かび上がる */
  #box.appear-aurora-rise.visible { animation: aurora-rise 900ms cubic-bezier(.2, .8, .2, 1); }
  @keyframes aurora-rise {
    from { opacity: 0; filter: blur(10px); transform: var(--off) translateY(16px) scale(0.98); }
    to { opacity: 1; filter: blur(0); transform: var(--off) translateY(0) scale(1); }
  }
  /* 羽ペン: まず紙(字幕の枠)がふわっと出て、羽ペンが1文字ずつさらさら書いていく(show参照) */
  #box.appear-quill-write.visible { animation: quill-paper 320ms ease-out; }
  @keyframes quill-paper {
    from { opacity: 0; transform: var(--off) translateY(6px) scale(0.97); }
    to { opacity: 1; transform: var(--off) translateY(0) scale(1); }
  }
  /* 書いたばかりの文字は、インクがにじむように濃くなる */
  .ink { animation: ink-in 320ms ease-out; }
  @keyframes ink-in {
    from { opacity: 0; filter: blur(1.5px); }
    to { opacity: 1; filter: blur(0); }
  }
  .quill-pen {
    position: absolute;
    width: 1.5em;
    height: 1.5em;
    margin: -1.35em 0 0 -0.25em;
    pointer-events: none;
    transition: left 70ms linear, top 70ms linear, opacity 300ms ease-out;
  }
  .quill-pen svg { width: 100%; height: 100%; animation: quill-wiggle 160ms ease-in-out infinite alternate; transform-origin: 10% 90%; }
  @keyframes quill-wiggle {
    from { transform: rotate(-7deg) translateY(1px); }
    to { transform: rotate(4deg) translateY(-2px); }
  }
  /* 1文字ずつ出している間、まだ出していない文字(場所だけ確保して見せない) */
  .tw-rest { visibility: hidden; }
  /* 黄色ライン: 左から右へ、さっと拭くように出る */
  #box.appear-wipe-left.visible { animation: wipe-left 360ms ease-out; }
  @keyframes wipe-left {
    from { opacity: 1; clip-path: inset(0 100% 0 0); }
    to { opacity: 1; clip-path: inset(0 0 0 0); }
  }
  /* ゆめかわ: ぷるんっと弾んで出てくる */
  #box.appear-cute-bounce.visible { transform-origin: left bottom; animation: cute-bounce 700ms cubic-bezier(.3, 1.7, .5, 1); }
  @keyframes cute-bounce {
    0% { opacity: 0; transform: var(--off) scale(0.3) rotate(-8deg); }
    45% { opacity: 1; transform: var(--off) scale(1.1, 0.92) rotate(2deg); }
    70% { transform: var(--off) scale(0.96, 1.05) rotate(-1deg); }
    100% { opacity: 1; transform: var(--off) scale(1) rotate(0); }
  }
  #box.aa {
    white-space: pre;
    word-break: normal;
    line-height: 1.1;
  }
  #box.vertical { writing-mode: vertical-rl; }
  .res-head { display: block; font-size: 0.75em; }
  /* レスの翻訳(本文の下に1行添える。カスタムCSSでは .translation) */
  .translation { display: block; margin-top: 0.15em; }
  /* YouTube・Twitchのコメントを書いた人のアイコン(レス番号の位置に出す) */
  .res-head .avatar { width: 1.3em; height: 1.3em; border-radius: 50%; object-fit: cover; vertical-align: -0.3em; margin-right: 0.3em; }
  /* アンカー先のレス(新しいレスの前に、斜体で先に表示する)。カスタムCSSでは #box.quoted */
  #box.quoted { transform-origin: left bottom; }

  /* デスクトップ字幕の位置調整モード(ReaCastの設定画面から切り替える) */
  #adjust {
    display: none;
    position: fixed;
    inset: 0;
    box-sizing: border-box;
    border: 3px dashed #ffd23f;
    background: rgba(20, 22, 30, 0.35);
    cursor: move;
    font-family: 'Yu Gothic UI', sans-serif;
    color: #fff;
  }
  body.adjusting #adjust { display: block; }
  #adjust .msg {
    position: absolute;
    left: 10px;
    top: 8px;
    font-size: 14px;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 8px;
    border-radius: 4px;
    pointer-events: none;
  }
  #adjust button {
    position: absolute;
    right: 10px;
    top: 8px;
    font: inherit;
    font-size: 14px;
    padding: 4px 14px;
    border: none;
    border-radius: 4px;
    background: #3b6df0;
    color: #fff;
    cursor: pointer;
  }
  #adjust .grip {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 22px;
    height: 22px;
    cursor: se-resize;
    background: linear-gradient(135deg, transparent 50%, #ffd23f 50%);
  }
</style>
</head>
<body>
  <div id="stage"><div id="box"></div></div>
  <div id="threadTitle"></div>
  <div id="adjust">
    <div class="msg">ドラッグで移動 / 右下の角をドラッグで大きさを変更</div>
    <button id="adjustDone">完了</button>
    <div class="grip" id="grip"></div>
  </div>
  <script src="shared/error-log.js"></script>
  <script src="shared/comment-common.js"></script>
  <script>
    'use strict';
    const C = window.CommentCommon;
    // ?preview: ReaCastの設定画面に埋め込むプレビュー用(ブリッジには繋がず、設定画面から
    // 見た目とサンプルのレスを受け取る)
    const PREVIEW = new URLSearchParams(location.search).has('preview');
    const box = document.getElementById('box');
    const stage = document.getElementById('stage');
    let style = C.mergeStyle(null);
    let hideTimer = null;
    let typeTimer = null;
    let current = null;
    // アンカー先のレスを先に表示している最中か(斜体で表示する)
    let quotedMode = false;

    const APPEARS = ['fade', 'slide-left', 'slide-up', 'pop-left', 'p5-slash', 'ff-open', 'neon-flicker', 'wipe-left', 'cute-bounce', 'quill-write', 'oc-bolt', 'aurora-rise', 'bbs-load'];
    // 羽ペン(「インクで書かれていく」の時に、書いている先を走る)
    const QUILL_SVG =
      '<svg viewBox="0 0 40 40"><path d="M37 3 C 26 4 14 12 9 27 L 7 31 L 10 30 C 20 26 31 17 37 3 Z" fill="#f4efe2" stroke="#6b4a2a" stroke-width="1.2"/>' +
      '<path d="M35 5 L 10 29" stroke="#8a6a44" stroke-width="1.1"/><path d="M10 29 L 4 37" stroke="#2b1d10" stroke-width="2.2" stroke-linecap="round"/></svg>';

    /** 届いた見た目の設定を使う。デスクトップ字幕で「プリセットと連動」がOFFなら、
     * プリセットの部分(フォント・色・背景・出し方・カスタムCSS)だけ既定に戻す。 */
    function setStyle(raw) {
      style = C.mergeStyle(raw);
      const desktop = !PREVIEW && !!(window.__TAURI__ && window.__TAURI__.core);
      if (desktop && style.subtitle.desktopUsePreset === false) {
        for (const k of C.SUBTITLE_PRESET_KEYS) style.subtitle[k] = C.DEFAULT_STYLE.subtitle[k];
      }
      C.applyCustomCss(style.subtitle.customCss);
    }

    function applyBoxStyle(aa) {
      const s = aa ? style.aa : style.subtitle;
      const sub = style.subtitle;
      box.style.fontFamily = C.cssFontFamily(s.fontFamily);
      box.style.fontSize = `${Number(s.fontSize) || 30}px`;
      box.style.fontWeight = aa ? 'normal' : sub.bold ? 'bold' : 'normal';
      box.style.fontStyle = (!aa && sub.italic) || quotedMode ? 'italic' : 'normal';
      box.style.color = quotedMode && !aa ? sub.quoteColor || s.color : s.color;
      box.classList.toggle('quoted', quotedMode);
      box.style.textShadow = C.outlineShadow(s.outlineWidth, s.outlineColor);
      const align = aa ? 'left' : sub.align || 'center';
      box.style.textAlign = align;
      // 字幕の箱そのものも文字揃えの側に寄せる(文字揃え「左」なら表示範囲の左端から
      // 出す)。箱を中央に置いたままだと、短い文や1文字ずつ表示している途中で
      // 真ん中から左右に広がっていくように見えてしまうため。
      stage.style.justifyContent = align === 'left' ? 'flex-start' : align === 'right' ? 'flex-end' : 'center';
      // 縦: 上端から下へ(既定)。下端揃えだと行数が増えるほど上に伸び、1行目
      // (レス番号)の位置がレスごとに上下にずれて見えるため。
      stage.style.alignItems = sub.valign === 'bottom' ? 'flex-end' : 'flex-start';
      const off = `translate(${Number(sub.offsetX) || 0}px, ${Number(sub.offsetY) || 0}px)`;
      box.style.setProperty('--off', off);
      box.style.transform = off;
      // 背景・余白・角の丸み(プリセット。不透明度0なら背景なし。AAには付けない)
      const bgOn = !aa && Number(sub.bgOpacity) > 0;
      box.style.background = bgOn ? C.rgba(sub.bgColor, sub.bgOpacity) : '';
      const pad = Number(sub.padding) || 0;
      box.style.padding = !aa && pad > 0 ? `${pad}px ${Math.round(pad * 1.4)}px` : '';
      box.style.borderRadius = !aa && Number(sub.radius) > 0 ? `${Number(sub.radius)}px` : '';
      box.classList.toggle('aa', !!aa);
      box.classList.toggle('vertical', !aa && !!sub.vertical);
      const appear = sub.appear || 'instant';
      box.classList.toggle('instant', appear !== 'fade');
      for (const a of APPEARS) box.classList.toggle(`appear-${a}`, appear === a);
    }

    /** 表示領域に収まらない場合は文字を小さくする(AAは設定に従い、
     * 通常の字幕は高さだけ常に収める)。 */
    function fitToStage(aa) {
      const base = Number((aa ? style.aa : style.subtitle).fontSize) || 30;
      box.style.fontSize = `${base}px`;
      const fitW = aa ? style.aa.shrinkToWidth : false;
      const fitH = aa ? style.aa.shrinkToHeight : true;
      const availW = window.innerWidth;
      const availH = window.innerHeight;
      let scale = 1;
      if (fitW && box.scrollWidth > availW) scale = Math.min(scale, availW / box.scrollWidth);
      if (fitH && box.scrollHeight > availH) scale = Math.min(scale, availH / box.scrollHeight);
      if (scale < 1) box.style.fontSize = `${Math.max(6, Math.floor(base * scale))}px`;
    }

    /** shownを渡すと、本文はshown文字目までを見せて、残りは場所だけ確保して隠す
     * (1文字ずつ出している途中でも、全部出した時と同じ大きさ・折り返しにするため) */
    function setContent(res, body, shown) {
      box.textContent = '';
      const sub = style.subtitle;
      if (!res.aa) {
        const head = C.resHeader(
          { ...res, no: res.no > 0 ? res.no : 0 },
          {
            showResNumber: sub.showResNumber,
            showName: sub.showName,
            showDate: sub.showTime,
          }
        );
        // 番号は「レス69」の形にする(名前・時刻はそのまま)
        const label = sub.showResNumber && res.no > 0 && !res.system ? head.replace(/^\d+/, `レス${res.no}`) : head;
        // YouTube・Twitchのコメントは、レス番号の代わりに書いた人のアイコンを出す
        const avatar = sub.showResNumber && !res.system && !(res.no > 0) && res.avatar;
        if (label || avatar) {
          const el = document.createElement('span');
          el.className = 'res-head';
          if (avatar) {
            const img = document.createElement('img');
            img.className = 'avatar';
            img.src = res.avatar;
            img.referrerPolicy = 'no-referrer';
            img.onerror = () => img.remove();
            el.appendChild(img);
          }
          el.appendChild(document.createTextNode(label));
          box.appendChild(el);
        }
      }
      if (typeof shown === 'number') {
        const chars = Array.from(body);
        const ink = style.subtitle.appear === 'quill-write' && shown > 0;
        box.appendChild(document.createTextNode(chars.slice(0, ink ? shown - 1 : shown).join('')));
        if (ink) {
          const last = document.createElement('span');
          last.className = 'ink';
          last.textContent = chars[shown - 1];
          box.appendChild(last);
        }
        // 羽ペンの位置の目印(書いている所)
        const caret = document.createElement('span');
        caret.className = 'tw-caret';
        box.appendChild(caret);
        const rest = document.createElement('span');
        rest.className = 'tw-rest';
        rest.textContent = chars.slice(shown).join('');
        box.appendChild(rest);
      } else {
        box.appendChild(document.createTextNode(body));
      }
      // レスの翻訳(届いていれば。1文字ずつ出している途中は、出し終わってから)。
      // 翻訳するレス(tid付き)は、翻訳が届く前から1行分の場所を空けておく
      // (届いた時に枠がぴょこっと広がらないように)
      const waiting = res.tid && !res.translation && !res.aa;
      if ((res.translation && !res.aa) || waiting) {
        const t = document.createElement('span');
        t.className = 'translation';
        t.textContent = waiting ? '\u00a0' : res.translation;
        // 1文字ずつ出している間は、場所だけ確保して見せない
        if (res.typing) t.style.visibility = 'hidden';
        t.style.color = style.subtitle.translationColor || '#ffe066';
        t.style.fontSize = `${Math.max(0.3, Number(style.subtitle.translationScale) || 0.75)}em`;
        box.appendChild(t);
      }
    }

    function show(res, durationMs, replay) {
      clearTimeout(hideTimer);
      clearInterval(typeTimer);
      current = res;
      quotedMode = !!res.quoted;
      applyBoxStyle(res.aa);
      const body = String(res.body || '');
      const appear = style.subtitle.appear;
      const quill = appear === 'quill-write';
      const typewriter = (appear === 'typewriter' || quill) && !res.aa && !replay && body.length > 1;
      // スライド等のアニメーションを毎回最初から再生し直す
      box.classList.remove('visible');
      void box.offsetWidth;
      if (!typewriter) {
        setContent(res, body);
        fitToStage(res.aa);
      } else {
        // 1文字ずつ表示する。最初に全文分の場所を確保して、文字の大きさはその時に1回だけ
        // 決める(出し終わった瞬間に、翻訳などが増えて文字が小さくなって見えないように)。
        // 羽ペンは、紙が出てから、少しゆっくり書いていく
        const chars = Array.from(body);
        const totalMs = quill
          ? Math.min(3200, Math.max(500, chars.length * 55, durationMs / 3))
          : Math.min(1200, Math.max(200, durationMs / 2));
        const stepMs = Math.max(16, totalMs / chars.length);
        let shown = 0;
        res.typing = true;
        setContent(res, body, 0);
        fitToStage(false);
        let pen = null;
        if (quill) {
          pen = document.createElement('span');
          pen.className = 'quill-pen';
          pen.innerHTML = QUILL_SVG;
        }
        const placePen = () => {
          if (!pen) return;
          const caret = box.querySelector('.tw-caret');
          box.appendChild(pen);
          if (caret) {
            pen.style.left = `${caret.offsetLeft}px`;
            pen.style.top = `${caret.offsetTop + caret.offsetHeight}px`;
          }
        };
        const step = () => {
          shown = Math.min(chars.length, shown + Math.max(1, Math.round(16 / stepMs)));
          setContent(res, body, shown);
          placePen();
          if (shown >= chars.length) {
            clearInterval(typeTimer);
            res.typing = false;
            setTimeout(() => {
              if (current !== res) return;
              setContent(res, body);
              if (pen) {
                box.appendChild(pen);
                pen.style.opacity = '0';
                setTimeout(() => pen.remove(), 350);
              }
            }, quill ? 250 : 0);
          }
        };
        const start = () => {
          if (current !== res) return;
          placePen();
          typeTimer = setInterval(step, stepMs);
        };
        if (quill) setTimeout(start, 320);
        else start();
      }
      box.classList.add('visible');
      hideTimer = setTimeout(hide, Math.max(300, Number(durationMs) || 3000));
    }

    function hide() {
      clearInterval(typeTimer);
      box.classList.remove('visible');
      current = null;
      if (adjusting) showSample();
    }

    // ---- デスクトップ字幕の位置調整(ReaCastの中で開かれた時だけ) ----
    let adjusting = false;
    function showSample() {
      current = { no: 123, name: '名無しさん', date: '', body: '字幕の表示位置サンプル 123 ABC', aa: false };
      quotedMode = false;
      applyBoxStyle(false);
      setContent(current, current.body);
      fitToStage(false);
      box.classList.add('visible');
    }
    function setAdjusting(on) {
      adjusting = !!on;
      document.body.classList.toggle('adjusting', adjusting);
      if (adjusting) showSample();
      else hide();
    }
    const tauri = window.__TAURI__;
    if (tauri && tauri.core && !PREVIEW) {
      const win = tauri.window.getCurrentWindow();
      document.getElementById('adjust').addEventListener('mousedown', (e) => {
        if (e.button !== 0 || e.target.closest('button') || e.target.id === 'grip') return;
        win.startDragging();
      });
      document.getElementById('grip').addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        win.startResizeDragging('SouthEast');
      });
      document.getElementById('adjustDone').addEventListener('click', () => {
        tauri.core.invoke('comments_desktop_adjust', { on: false });
      });
      tauri.event.listen('subtitle:adjust', (e) => setAdjusting(e.payload));
      tauri.core.invoke('comments_desktop_adjusting').then(setAdjusting).catch(() => {});
    }

    // ---- 今読んでいるスレッドのタイトル ----
    const titleEl = document.getElementById('threadTitle');
    let threadTitle = PREVIEW ? '配信スレ Part12' : '';
    function renderThreadTitle() {
      const s = style.subtitle;
      const desktop = !PREVIEW && !!(window.__TAURI__ && window.__TAURI__.core);
      // デスクトップ字幕には出さない(字幕の枠だけの小さな窓なので、重なって読みにくい)
      const on = !!s.threadTitleShow && !!threadTitle && !desktop;
      titleEl.classList.toggle('show', on);
      if (!on) return;
      titleEl.textContent = threadTitle;
      titleEl.style.fontFamily = C.cssFontFamily(s.fontFamily);
      titleEl.style.fontSize = `${Number(s.threadTitleSize) || 18}px`;
      titleEl.style.color = s.threadTitleColor || '#ffffff';
      titleEl.style.background = C.rgba(s.threadTitleBgColor, Number(s.threadTitleBgOpacity));
      titleEl.style.textShadow = Number(s.threadTitleBgOpacity) > 30 ? 'none' : C.outlineShadow(2, '#000000');
      const pos = String(s.threadTitlePos || 'top-left');
      const x = Number(s.threadTitleOffsetX) || 0;
      const y = Number(s.threadTitleOffsetY) || 0;
      const m = 8;
      titleEl.style.left = titleEl.style.right = titleEl.style.top = titleEl.style.bottom = '';
      titleEl.style.transform = '';
      if (pos.startsWith('top')) titleEl.style.top = `${m + y}px`;
      else titleEl.style.bottom = `${m - y}px`;
      if (pos.endsWith('left')) titleEl.style.left = `${m + x}px`;
      else if (pos.endsWith('right')) titleEl.style.right = `${m - x}px`;
      else {
        titleEl.style.left = `calc(50% + ${x}px)`;
        titleEl.style.transform = 'translateX(-50%)';
      }
    }

    function handle(msg) {
      if (msg.type === 'threadTitle') {
        threadTitle = typeof msg.title === 'string' ? msg.title : '';
        renderThreadTitle();
        return;
      }
      if (msg.type === 'commentStyle') {
        setStyle(msg.style);
        renderThreadTitle();
        if (current) {
          applyBoxStyle(current.aa);
          setContent(current, String(current.body || ''));
          fitToStage(current.aa);
        }
      } else if (msg.type === 'subtitle' && msg.res) {
        show(msg.res, msg.durationMs, !!msg.replay);
      } else if (msg.type === 'subtitleClear') {
        hide();
      } else if (msg.type === 'subtitleTranslation' && current && current.tid === msg.tid) {
        // 今出ている字幕のレスの翻訳が届いた: 本文の下に添える
        current.translation = msg.text;
        if (!current.typing) {
          setContent(current, String(current.body || ''));
          fitToStage(current.aa);
        }
      }
    }
    if (PREVIEW) {
      window.addEventListener('message', (e) => {
        if (e.source !== window.parent || !e.data || typeof e.data.type !== 'string') return;
        handle(e.data);
      });
    } else {
      C.connectBridge(handle);
    }
    window.addEventListener('resize', () => {
      if (current) fitToStage(current.aa);
    });
  </script>
</body>
</html>
